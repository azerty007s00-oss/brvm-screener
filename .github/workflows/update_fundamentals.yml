name: BRVM Fundamentals Update

on:
  schedule:
    - cron: '0 6 * * 0'   # Chaque dimanche 06:00 UTC (marchés fermés)
  workflow_dispatch:        # Déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write           # Nécessaire pour git push du JSON mis à jour

jobs:
  update-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape fundamentals
        run: python build_fundamentals_history.py --force --delay 2.0
        continue-on-error: true   # SikaFinance peut bloquer les IPs CI — non bloquant

      - name: Commit updated fundamentals
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals_history.json
          if git diff --cached --quiet; then
            echo "Aucune mise a jour des fondamentaux detectee."
          else
            # Comptage en une ligne, sans document imbrique : un heredoc dont le
            # corps commence en colonne 0 ferme le bloc « run: | » de YAML, et
            # GitHub ne sait alors plus lire le fichier. Le run echoue au
            # demarrage a chaque poussee, sur toutes les branches.
            TICKERS=$(python -c 'import json; d = json.load(open("data/fundamentals_history.json")); s = d.get("stocks", {}); n = len([t for t in s if s[t].get("history")]); print(f"{n}/{len(s)} tickers")' 2>/dev/null || echo "?")
            git commit -m "data: mise a jour fondamentaux BRVM $(date -u '+%Y-%m-%d') — ${TICKERS}"
            git pull --rebase origin main
            git push
          fi
