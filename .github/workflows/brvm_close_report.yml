name: BRVM Close Market Report

on:
  schedule:
    - cron: '0 15 * * 1-5'   # Cloture BRVM 15:00 UTC, lundi-vendredi
  workflow_dispatch:           # Declenchement manuel depuis l'onglet Actions

permissions:
  contents: read

jobs:
  close-market-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # Le scan de 46 tickers prend ~15 min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run close market report
        env:
          ALERT_EMAIL_FROM:     ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_TO:       ${{ secrets.ALERT_EMAIL_TO }}
          CAPITAL_TOTAL:        ${{ secrets.CAPITAL_TOTAL }}
        run: python close_market_report.py
